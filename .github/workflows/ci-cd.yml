name: Automated CI/CD Pipeline with AWS and GitHub Actions

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  
  test:
    name: 1. CI - Automated Testing
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: 18
          

      - name: Make Scripts Executable
        run: chmod +x scripts/*.sh

      - name: Run Curl-Based Fail-Fast Test
        run: ./scripts/test.sh

  build-and-push:
    name: 2. CD - Build & Push Docker Image
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/node-cicd-app:latest
            ${{ secrets.DOCKER_USERNAME }}/node-cicd-app:${{ github.sha }}

  deploy:
    name: 3. CD - Remote SSH Deployment & Health Check
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Execute Deployment Commands on Remote Server (AWS EC2)
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            set -e
            echo "================================================="
            echo " Starting Deployment on Remote Host             "
            echo "================================================="

            echo "[1/5] Pulling latest Docker image from DockerHub..."
            docker pull ${{ secrets.DOCKER_USERNAME }}/node-cicd-app:latest

            echo "[2/5] Stopping and removing old container (if running)..."
            docker stop node-app 2>/dev/null || true
            docker rm node-app 2>/dev/null || true

            echo "[3/5] Starting new container on port 3000..."
            docker run -d \
              --name node-app \
              -p 3000:3000 \
              --restart always \
              ${{ secrets.DOCKER_USERNAME }}/node-cicd-app:latest

            echo "[4/5] Running post-deployment health check..."
            sleep 5
            HEALTH_URL="http://127.0.0.1:3000/"
            RESPONSE=$(curl -s "$HEALTH_URL" || echo "")

            echo "Response: $RESPONSE"
            if [[ "$RESPONSE" == *"Hello, Node.js!"* ]]; then
              echo "[PASS] Health check succeeded! Application is live."
            else
              echo "[FAIL] Application health check failed!"
              docker logs node-app
              exit 1
            fi

            echo "[5/5] Pruning unused and dangling Docker images..."
            docker image prune -f

            echo "================================================="
            echo " DEPLOYMENT COMPLETED SUCCESSFULLY!             "
            echo "================================================="

